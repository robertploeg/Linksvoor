document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"5372bcce-9af6-4baa-8e20-09e448a96af0\"><\u002Fscript>\n<script src=\"73b74ea3-a503-494a-909c-33eab14cbb9d\"><\u002Fscript>\n<script src=\"9ed4ebb5-3abd-49d4-a5eb-e69559fc4dec\"><\u002Fscript>\n<style>\n:root {\n  --color-bg: var(--color-neutral-900);\n  --color-surface: var(--color-neutral-800);\n  --color-text: var(--color-neutral-100);\n  --color-divider: color-mix(in srgb, var(--color-neutral-100) 22%, transparent);\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);\n  --shadow-md: 0 4px 14px rgba(0,0,0,0.55);\n  --shadow-lg: 0 16px 40px rgba(0,0,0,0.65);\n}\nbody { background: var(--color-bg); margin: 0; }\na { color: var(--color-accent-400); }\na:hover { color: var(--color-accent-300); }\ninput[type=\"checkbox\"].fp-check { position: absolute; opacity: 0; width: 0; height: 0; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"{{ appRootStyle }}background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);display:flex;flex-direction:column;\">\n\n<sc-if value=\"{{ notReady }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding:80px 20px;text-align:center;color:color-mix(in srgb, var(--color-text) 60%, transparent);\">Festivalplanner laden…<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasInitError }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding:80px 20px;text-align:center;max-width:420px;margin:0 auto;\">\n    <p style=\"color:var(--color-accent-400);font-weight:700;margin-bottom:8px;\">Kon niet verbinden<\u002Fp>\n    <p style=\"color:color-mix(in srgb, var(--color-text) 70%, transparent);\">{{ initError }}<\u002Fp>\n  <\u002F .08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin-bottom:8px;\">{{ pd.label }} · {{ pd.date }}<\u002Fdiv>\n            <sc-if value=\"{{ pd.hasActs }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;\">\n                <sc-for list=\"{{ pd.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                  <div class=\"card\" style=\"flex-direction:row;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;\">\n                    <div style=\"min-width:0;\">\n                      <div style=\"font-weight:700;\">{{ it.name }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 55%, transparent);\">{{ it.stage }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:13px;font-weight:700;white-space:nowrap;\">{{ it.timeLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ pd.noActs }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 45%, transparent);margin:0;\">Nog geen acts gekozen voor deze dag.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nclass Component extends DCLogic {\n  state = {\n    ready: false,\n    groups: {},\n    session: null,\n    activeGroupCode: null,\n    onboardStep: 'start',\n    joinCodeInput: '', joinError: '',\n    createNameInput: '',\n    pinTarget: null, pinInput: '', pinError: '',\n    regName: '', regPin: '', regColor: '', regError: '',\n    tab: 'lineup',\n    day: 'vr',\n    stageFilter: [],\n    majorityOnly: false,\n    popupActId: null,\n    planningPersonId: null,\n    manualBlockStage: null, tentStart: '16:00', tentEnd: '17:00', tentLabel: '',\n    checkinView: 'list',\n    liveOverride: 'auto',\n    chatInput: '',\n    checkinOpen: false, chatOpen: false,\n  };\n\n  firebaseConfig = {\n    apiKey: \"AIzaSyDEOKqI9MN1b5mRCEIniSdbiFc1f6AETr0\",\n    authDomain: \"festival-planner-1f88f.firebaseapp.com\",\n    databaseURL: \"https://festival-planner-1f88f-default-rtdb.europe-west1.firebasedatabase.app\",\n    projectId: \"festival-planner-1f88f\",\n    storageBucket: \"festival-planner-1f88f.firebasestorage.app\",\n    messagingSenderId: \"1070292002823\",\n    appId: \"1:1070292002823:web:b6d508dfa4623d36a162a2\",\n  };\n\n  componentDidMount() {\n    this.init();\n  }\n\n  async init() {\n    try {\n      const dataUrl = (window.__resources && window.__resources.festivalData) || './festival-data.js?v=21';\n      const DATA = await import(dataUrl);\n      this.DATA = DATA;\n    } catch (e) {\n      this.setState({ ready: true, initError: 'Kan festival-data.js niet laden (' + (e && e.message ? e.message : 'onbekende fout') + '). Probeer de pagina te verversen.' });\n      return;\n    }\n    const DATA = this.DATA;\n    try {\n      let waited = 0;\n      while (!window.firebase && waited < 8000) { await new Promise(r => setTimeout(r, 100)); waited += 100; }\n      if (!window.firebase) throw new Error('Firebase SDK kon niet laden (netwerk/CDN probleem).');\n      if (!window.firebase.apps.length) window.firebase.initializeApp(this.firebaseConfig);\n      this.db = window.firebase.database();\n      await this.ensureSeed(DATA);\n    } catch (e) {\n      this.setState({ ready: true, initError: 'Kan geen verbinding maken met de database (' + (e && e.message ? e.message : 'onbekende fout') + '). Check de Firebase Realtime Database rules.' });\n      return;\n    }\n    let session = null;\n    try { session = JSON.parse(localStorage.getItem('fp_session') || 'null'); } catch (e) { session = null; }\n    let liveOverride = 'auto';\n    try { liveOverride = localStorage.getItem('fp_live_override') || 'auto'; } catch (e) {}\n    this.setState({\n      ready: true, groups: {}, session: null,\n      activeGroupCode: session ? session.code : null,\n      onboardStep: 'start',\n      stageFilter: [...DATA.STAGES],\n      liveOverride,\n    });\n    if (session && session.code) {\n      this.subscribeGroup(session.code, () => {\n        const group = this.state.groups[session.code];\n        if (group && group.people.find(p => p.id === session.personId)) {\n          this.setState({ session });\n        } else {\n          localStorage.removeItem('fp_session');\n        }\n      });\n    }\n  }\n\n  async ensureSeed(DATA) {\n    const snap = await this.db.ref('groups/LOWLANDS').get();\n    if (!snap.exists()) {\n      const people = {};\n      DATA.SEED_PEOPLE.forEach(p => { people[p.id] = { name: p.name, pin: p.pin, color: p.color }; });\n      await this.db.ref('groups/LOWLANDS').set({ name: 'Lowlands Bende', people, votes: DATA.generateSeedVotes(), locks: {}, tentBlocks: {}, checkins: {} });\n    }\n  }\n\n  normalizeGroup(val) {\n    const peopleObj = val.people || {};\n    const people = Object.keys(peopleObj).map(id => ({ id, ...peopleObj[id] }));\n    const tbObj = val.tentBlocks || {};\n    const tentBlocks = Object.keys(tbObj).map(id => ({ id, ...tbObj[id], joiners: Object.keys(tbObj[id].joiners || {}) }));\n    const chatObj = val.chat || {};\n    const chat = Object.keys(chatObj).map(id => ({ id, ...chatObj[id] })).sort((a, b) => a.ts - b.ts);\n    return { name: val.name || '', people, votes: val.votes || {}, locks: val.locks || {}, tentBlocks, checkins: val.checkins || {}, chat };\n  }\n\n  subscribeGroup(code, onFirst) {\n    if (this.unsubGroup) this.unsubGroup();\n    const ref = this.db.ref('groups/' + code);\n    let first = true;\n    const handler = (snap) => {\n      const val = snap.val() || { name: '', people: {}, votes: {}, locks: {}, tentBlocks: {}, checkins: {}, chat: {} };\n      const group = this.normalizeGroup(val);\n      this.setState(s => ({ groups: { ...s.groups, [code]: group } }), () => { if (first) { first = false; if (onFirst) onFirst(); } });\n    };\n    ref.on('value', handler);\n    this.unsubGroup = () => ref.off('value', handler);\n  }\n\n  saveSession(session) {\n    localStorage.setItem('fp_session', JSON.stringify(session));\n  }\n\n  genCode() {\n    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';\n    let out = '';\n    for (let i = 0; i < 5; i++) out += chars[Math.floor(Math.random() * chars.length)];\n    return out;\n  }\n\n  onCreateGroup = async () => {\n    const name = this.state.createNameInput.trim();\n    if (!name) { this.setState({ joinError: 'Geef je groep een naam.' }); return; }\n    const code = this.genCode();\n    await this.db.ref('groups/' + code).set({ name, people: {}, votes: {}, locks: {}, tentBlocks: {}, checkins: {} });\n    this.subscribeGroup(code);\n    this.setState({ activeGroupCode: code, onboardStep: 'register', joinError: '', createNameInput: '' });\n  };\n\n  onJoinGroup = async () => {\n    const code = this.state.joinCodeInput.trim().toUpperCase();\n    if (!code) { this.setState({ joinError: 'Groepscode niet gevonden.' }); return; }\n    const snap = await this.db.ref('groups/' + code).get();\n    if (!snap.exists()) { this.setState({ joinError: 'Groepscode niet gevonden.' }); return; }\n    this.subscribeGroup(code);\n    this.setState({ activeGroupCode: code, onboardStep: 'people', joinError: '' });\n  };\n\n  onBackToStart = () => this.setState({ onboardStep: 'start', activeGroupCode: null, joinError: '' });\n  onBackToPeople = () => this.setState({ onboardStep: 'people', pinError: '' });\n  onBackFromRegister = () => this.setState({ onboardStep: this.state.groups[this.state.activeGroupCode].people.length ? 'people' : 'start' });\n\n  selectPersonForLogin(personId) {\n    this.setState({ pinTarget: personId, pinInput: '', pinError: '', onboardStep: 'pin' });\n  }\n\n  onSubmitPin = () => {\n    const group = this.state.groups[this.state.activeGroupCode];\n    const person = group.people.find(p => p.id === this.state.pinTarget);\n    if (!person || person.pin !== this.state.pinInput) { this.setState({ pinError: 'Onjuiste pincode.' }); return; }\n    const session = { code: this.state.activeGroupCode, personId: person.id };\n    this.saveSession(session);\n    this.setState({ session, pinInput: '', pinError: '' });\n  };\n\n  onStartRegister = () => {\n    const colors = this.DATA.AVATAR_COLORS;\n    this.setState({ onboardStep: 'register', regName: '', regPin: '', regColor: colors[Math.floor(Math.random() * colors.length)], regError: '' });\n  };\n\n  onSubmitRegister = () => {\n    const { regName, regPin, activeGroupCode } = this.state;\n    const name = regName.trim();\n    if (!name) { this.setState({ regError: 'Vul je naam in.' }); return; }\n    if (!/^\\d{4}$/.test(regPin)) { this.setState({ regError: 'Pincode moet 4 cijfers zijn.' }); return; }\n    const group = this.state.groups[activeGroupCode];\n    if (group.people.some(p => p.name.toLowerCase() === name.toLowerCase())) { this.setState({ regError: 'Die naam is al in gebruik in deze groep.' }); return; }\n    const person = { id: 'p' + Date.now(), name, pin: regPin, color: this.state.regColor };\n    this.db.ref(`groups/${activeGroupCode}/people/${person.id}`).set({ name: person.name, pin: person.pin, color: person.color });\n    const session = { code: activeGroupCode, personId: person.id };\n    this.saveSession(session);\n    this.setState({ session, regError: '' });\n  };\n\n  onSwitchPerson = () => {\n    this.saveSession(null);\n    this.setState({ session: null, onboardStep: 'people' });\n  };\n\n  setVote(actId, choice) {\n    const { session } = this.state;\n    this.db.ref(`groups/${session.code}/votes/${session.personId}/${actId}`).set(choice);\n  }\n\n  toggleStage(stage) {\n    const has = this.state.stageFilter.includes(stage);\n    this.setState({ stageFilter: has ? this.state.stageFilter.filter(s => s !== stage) : [...this.state.stageFilter, stage] });\n  }\n\n  toggleLock(key, actId) {\n    const { session, groups } = this.state;\n    const group = groups[session.code];\n    const ref = this.db.ref(`groups/${session.code}/locks/${key}`);\n    if (group.locks[key] === actId) ref.remove(); else ref.set(actId);\n  }\n\n  parseTentTime(hhmm) {\n    let [h, m] = hhmm.split(':').map(Number);\n    if (h < 10) h += 24;\n    return h * 60 + m;\n  }\n\n  onOpenTentForm = (stage) => this.setState({ manualBlockStage: stage, tentLabel: '' });\n  onCancelTentForm = () => this.setState({ manualBlockStage: null });\n  onTentStartChange = (e) => this.setState({ tentStart: e.target.value });\n  onTentEndChange = (e) => this.setState({ tentEnd: e.target.value });\n  onTentLabelChange = (e) => this.setState({ tentLabel: e.target.value });\n\n  onSubmitTentBlock = () => {\n    const { session, tentStart, tentEnd, tentLabel, day, manualBlockStage } = this.state;\n    const start = this.parseTentTime(tentStart);\n    let end = this.parseTentTime(tentEnd);\n    if (end <= start) end += 24 * 60;\n    const id = 'tent' + Date.now();\n    const block = { day, start, end, label: tentLabel.trim() || 'Chillen', stage: manualBlockStage || 'Tent', creatorId: session.personId, joiners: { [session.personId]: true } };\n    this.db.ref(`groups/${session.code}/tentBlocks/${id}`).set(block);\n    this.setState({ manualBlockStage: null });\n  };\n\n  onToggleJoinTent(blockId) {\n    const { session, groups } = this.state;\n    const group = groups[session.code];\n    const block = group.tentBlocks.find(b => b.id === blockId);\n    const ref = this.db.ref(`groups/${session.code}/tentBlocks/${blockId}/joiners/${session.personId}`);\n    if (block.joiners.includes(session.personId)) ref.remove(); else ref.set(true);\n  }\n\n  onDeleteTentBlock(blockId) {\n    const { session } = this.state;\n    this.db.ref(`groups/${session.code}/tentBlocks/${blockId}`).remove();\n  }\n\n  setLiveOverride(v) {\n    try { localStorage.setItem('fp_live_override', v); } catch (e) {}\n    this.setState({ liveOverride: v });\n  }\n\n  setCheckin(zoneId, x, y) {\n    const { session } = this.state;\n    const val = { zone: zoneId, updatedAt: Date.now() };\n    if (x != null) { val.x = x; val.y = y; }\n    this.db.ref(`groups/${session.code}/checkins/${session.personId}`).set(val);\n  }\n\n  zoneIdForStage(stageName) {\n    const z = this.DATA.CHECKIN_ZONES.find(z => z.label === stageName);\n    return z ? z.id : stageName.toLowerCase();\n  }\n\n  onStageShapeClick(stageName, e) {\n    const rect = e.currentTarget.getBoundingClientRect();\n    const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);\n    const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);\n    this.setCheckin(this.zoneIdForStage(stageName), x, y);\n  }\n\n  sendChatMessage() {\n    const { session } = this.state;\n    const text = this.state.chatInput.trim();\n    if (!text) return;\n    const id = 'm' + Date.now() + Math.floor(Math.random() * 1000);\n    this.db.ref(`groups/${session.code}/chat/${id}`).set({ personId: session.personId, text, ts: Date.now() });\n    this.setState({ chatInput: '' });\n  }\n\n  clearCheckin() {\n    const { session } = this.state;\n    this.db.ref(`groups/${session.code}/checkins/${session.personId}`).remove();\n  }\n\n  timeAgo(ts) {\n    if (!ts) return '';\n    const diffMin = Math.max(0, Math.round((Date.now() - ts) / 60000));\n    if (diffMin < 1) return 'net';\n    if (diffMin < 60) return `${diffMin} min geleden`;\n    const h = Math.floor(diffMin / 60);\n    return `${h} uur geleden`;\n  }\n\n  avatarStyle(color, size) {\n    return `width:${size}px;height:${size}px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;font-size:${Math.round(size * 0.4)}px;`;\n  }\n\n  overlaps(a, b) { return a.start < b.end && b.start < a.end; }\n\n  openPopup(actId) { this.setState({ popupActId: actId }); }\n  closePopup = () => this.setState({ popupActId: null });\n  voteAndClose(actId, choice) { this.setVote(actId, choice); this.setState({ popupActId: null }); }\n  onVoteSelect(actId, choice) { this.setVote(actId, choice); }\n  stopClick = (e) => e.stopPropagation();\n\n  mergeClusters(acts) {\n    const sorted = acts.slice().sort((a, b) => a.start - b.start);\n    const clusters = [];\n    sorted.forEach(act => {\n      const last = clusters[clusters.length - 1];\n      if (last && act.start < last.end) {\n        last.acts.push(act);\n        last.end = Math.max(last.end, act.end);\n      } else {\n        clusters.push({ end: act.end, acts: [act] });\n      }\n    });\n    return clusters.map(c => c.acts);\n  }\n\n  renderVals() {\n    const S = this.state;\n    if (!S.ready) return { notReady: true, showOnboarding: false, showApp: false, hasInitError: false, appRootStyle: 'min-height:100%;' };\n    if (S.initError) return { notReady: false, showOnboarding: false, showApp: false, hasInitError: true, initError: S.initError, appRootStyle: 'min-height:100%;' };\n    const DATA = this.DATA;\n    const session = S.session;\n\n    if (!session) {\n      const activeGroup = S.activeGroupCode ? S.groups[S.activeGroupCode] : null;\n      const stepStart = S.onboardStep === 'start' || !S.activeGroupCode;\n      const stepPeople = S.onboardStep === 'people' && !!activeGroup;\n      const stepPin = S.onboardStep === 'pin' && !!activeGroup;\n      const stepRegister = S.onboardStep === 'register' && !!activeGroup;\n\n      const peopleList = activeGroup ? activeGroup.people.map(p => ({\n        name: p.name, initial: p.name[0].toUpperCase(),\n        avatarStyle: this.avatarStyle(p.color, 40),\n        onSelect: () => this.selectPersonForLogin(p.id),\n      })) : [];\n\n      const pinPerson = activeGroup && S.pinTarget ? activeGroup.people.find(p => p.id === S.pinTarget) : null;\n\n      const colorSwatches = DATA.AVATAR_COLORS.map(c => ({\n        style: `width:32px;height:32px;border-radius:50%;background:${c};cursor:pointer;box-sizing:border-box;border:${S.regColor === c ? '3px solid var(--color-text)' : '1px solid var(--color-divider)'};`,\n        onSelect: () => this.setState({ regColor: c }),\n      }));\n\n      return {\n        notReady: false, showOnboarding: true, showApp: false, appRootStyle: 'min-height:100%;',\n        stepStart, stepPeople, stepPin, stepRegister,\n        joinCodeInput: S.joinCodeInput, joinError: S.joinError,\n        onJoinCodeChange: (e) => this.setState({ joinCodeInput: e.target.value }),\n        onJoinGroup: this.onJoinGroup,\n        createNameInput: S.createNameInput,\n        onCreateNameChange: (e) => this.setState({ createNameInput: e.target.value }),\n        onCreateGroup: this.onCreateGroup,\n        activeGroupName: activeGroup ? activeGroup.name : '',\n        activeGroupCode: S.activeGroupCode || '',\n        onBackToStart: this.onBackToStart,\n        peopleList,\n        onStartRegister: this.onStartRegister,\n        onBackToPeople: this.onBackToPeople,\n        pinPersonName: pinPerson ? pinPerson.name : '',\n        pinPersonInitial: pinPerson ? pinPerson.name[0].toUpperCase() : '',\n        pinPersonAvatarStyle: pinPerson ? this.avatarStyle(pinPerson.color, 44) : '',\n        pinInput: S.pinInput, pinError: S.pinError,\n        onPinChange: (e) => this.setState({ pinInput: e.target.value.replace(/\\D/g, '').slice(0, 4) }),\n        onSubmitPin: this.onSubmitPin,\n        onBackFromRegister: this.onBackFromRegister,\n        regName: S.regName,\n        onRegNameChange: (e) => this.setState({ regName: e.target.value }),\n        regPin: S.regPin,\n        onRegPinChange: (e) => this.setState({ regPin: e.target.value.replace(/\\D/g, '').slice(0, 4) }),\n        colorSwatches,\n        regError: S.regError,\n        onSubmitRegister: this.onSubmitRegister,\n      };\n    }\n\n    const group = S.group pAct) {\n      const mine = myVotes[popupAct.id];\n      popupVals = {\n        popupOpen: true,\n        popupName: popupAct.name,\n        popupMeta: `${popupAct.stage} · ${popupAct.startLabel}–${popupAct.endLabel}`,\n        popupWarning: warningFor(popupAct),\n        popupCountLabel: `${group.people.filter(p => (group.votes[p.id] || {})[popupAct.id] === 'wil').length}/${total} wil dit zien`,\n        popupBio: popupAct.bio || 'Nog geen programmatekst van Lowlands beschikbaar voor dit act.',\n        popupHasVotes: group.people.some(p => (group.votes[p.id] || {})[popupAct.id]),\n        popupVoteRows: group.people.filter(p => (group.votes[p.id] || {})[popupAct.id]).map(p => {\n          const choice = group.votes[p.id][popupAct.id];\n          const cfg = { wil: ['Wil zien', 'var(--color-accent-700)'], twijfel: ['Twijfel', 'var(--color-surface)'], sla: ['Sla over', 'var(--color-surface)'] }[choice] || [choice, 'var(--color-surface)'];\n          const order = { wil: 0, twijfel: 1, sla: 2 }[choice] ?? 3;\n          return {\n            id: p.id, name: p.id === session.personId ? 'Ik' : p.name,\n            initial: p.name[0].toUpperCase(), avatarStyle: this.avatarStyle(p.color, 24),\n            choiceLabel: cfg[0], tagStyle: `font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:${cfg[1]};color:#fff;white-space:nowrap;`,\n            order,\n          };\n        }).sort((a, b) => a.order - b.order),\n        popupStageName: popupAct.stage,\n        popupStageMapSrc: (() => {\n          const zoneId = this.zoneIdForStage(popupAct.stage);\n          const resKey = 'stageMap' + zoneId.charAt(0).toUpperCase() + zoneId.slice(1);\n          if (window.__resources && window.__resources[resKey]) return window.__resources[resKey];\n          return `assets/stage-map-${zoneId}.png`;\n        })(),\n        popupOnStageClick: (e) => this.onStageShapeClick(popupAct.stage, e),\n        popupStageDots: (() => {\n          const zoneId = this.zoneIdForStage(popupAct.stage);\n          const checkins = group.checkins || {};\n          return group.people.filter(p => checkins[p.id] && checkins[p.id].zone === zoneId).map(p => {\n            const ci = checkins[p.id];\n            const x = ci.x != null ? ci.x : 50, y = ci.y != null ? ci.y : 50;\n            return {\n              id: p.id, initial: p.name[0].toUpperCase(),\n              style: `position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:${p.color};color:#fff;font-size:7px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--color-bg);`,\n            };\n          });\n        })(),\n        popupVoteValue: mine || '',\n        popupOnVoteChange: (e) => this.onVoteSelect(popupAct.id, e.target.value || null),\n        onClosePopup: this.closePopup,\n        stopClick: this.stopClick,\n      };\n    }\n\n    return {\n      ...popupVals,\n      notReady: false, showOnboarding: false, showApp: true,\n      groupName: group.name, groupCode: session.code,\n      meAvatarStyle: this.avatarStyle(me.color, 36), meInitial: me.name[0].toUpperCase(),\n      appRootStyle: 'min-height:100%;',\n      checkinOpen: S.checkinOpen, chatOpen: S.chatOpen,\n      onOpenCheckin: () => this.setState({ checkinOpen: true }),\n      onCloseCheckin: () => this.setState({ checkinOpen: false }),\n      onOpenChat: () => this.setState({ chatOpen: true }),\n      onCloseChat: () => this.setState({ chatOpen: false }),\n      onSwitchPerson: this.onSwitchPerson,\n      dayTabs,\n      lineupTabClass: S.tab === 'lineup' ? 'btn btn-primary' : 'btn btn-secondary',\n      groepTabClass: S.tab === 'groep' ? 'btn btn-primary' : 'btn btn-secondary',\n      planningTabClass: S.tab === 'planning' ? 'btn btn-primary' : 'btn btn-secondary',\n      onTabLineup: () => this.setState({ tab: 'lineup' }),\n      onTabGroep: () => this.setState({ tab: 'groep' }),\n      onTabPlanning: () => this.setState({ tab: 'planning' }),\n      stageChips,\n      isLineupTab: S.tab === 'lineup', isGroepTab: S.tab === 'groep', isPlanningTab: S.tab === 'planning',\n      majorityOnly: S.majorityOnly,\n      onToggleMajorityOnly: (e) => this.setState({ majorityOnly: e.target.checked }),\n      ...sceneVals,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
